allowBuilds:
  '@nestjs/core': true
  '@scarf/scarf': true
  bcrypt: true
  unrs-resolver: true

overrides:
  js-yaml: '>=5.2.2'
  'brace-expansion@5': '>=5.0.8'
  # tirés par @nestjs-modules/mailer > preview-email (fonctionnalité de
  # prévisualisation en dev, non utilisée par MailModule) > mailparser
  nodemailer: '>=9.0.1'
  linkify-it: '>=5.0.2'
  uuid: '>=11.1.1'

auditConfig:
  ignoreGhsas:
    # brace-expansion@1.x et @2.x sont tirés par minimatch@3.x et @9.x
    # dont l'API est incompatible avec la v5 patchée.
    # Ces versions sont des devDependencies uniquement (eslint, jest, @nestjs/cli).
    - GHSA-mh99-v99m-4gvg

