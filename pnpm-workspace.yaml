allowBuilds:
  '@nestjs/core': true
  '@scarf/scarf': true
  bcrypt: true
  unrs-resolver: true

overrides:
  js-yaml: '>=5.2.2'
  'brace-expansion@5': '>=5.0.8'

auditConfig:
